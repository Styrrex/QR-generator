<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR-генератор</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9b8ff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap">
<style>
:root{--b1:#ffd6c9;--b2:#c9b8ff;--ac:#6a3cff;--aci:#fff;--ink:#171321;--sf:rgba(255,255,255,.62);--ln:rgba(23,19,33,.15);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{min-height:100%;background:var(--b2)}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(150deg,var(--b1),var(--b2)) fixed;font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(60% 40% at 15% 8%,color-mix(in srgb,var(--ac) 30%,transparent),transparent),radial-gradient(55% 40% at 92% 88%,color-mix(in srgb,var(--ac) 24%,transparent),transparent)}
main{max-width:460px;margin:0 auto;padding:20px 16px 36px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 16px}
.card{background:var(--sf);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px}
.qr{aspect-ratio:1/1;display:grid;place-items:center;padding:12px}
.qr img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border-radius:12px}
.err{text-align:center;padding:0 12px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
textarea{min-height:84px;resize:vertical}
.gap{margin-top:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=color]{width:100%;height:44px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:4px}
button{font:600 16px Onest,system-ui,sans-serif;padding:14px;border-radius:14px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.primary{background:var(--ac);border-color:var(--ac);color:var(--aci)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
summary{font-weight:600;cursor:pointer}
details[open] summary{margin-bottom:14px}
.presets{display:flex;gap:10px;flex-wrap:wrap}
.presets button{width:52px;height:52px;padding:0;border-radius:50%;border:2px solid var(--ln)}
.presets button.on{border-color:var(--ink)}
.reset{width:100%;margin-top:14px;font-weight:400;font-size:15px;border-color:var(--ln)}
.hint{font-size:14px;opacity:.75;margin:0 0 14px;min-height:1.4em}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>QR-генератор</h1>
  <div class="card qr" id="box"></div>

  <div class="actions">
    <button class="primary" id="dl" type="button">Скачать PNG</button>
    <button id="share" type="button">Поделиться</button>
  </div>
  <p class="hint" id="hint"></p>

  <div class="card">
    <label for="txt">Текст или ссылка</label>
    <textarea id="txt" placeholder="https://example.com">https://claude.ai</textarea>
    <label class="gap" for="lvl">Защита от повреждений</label>
    <select id="lvl">
      <option value="L">Низкая (L)</option>
      <option value="M" selected>Средняя (M)</option>
      <option value="Q">Высокая (Q)</option>
      <option value="H">Максимальная (H)</option>
    </select>
  </div>

  <details class="card">
    <summary>Настройки</summary>
    <label>Готовые темы</label>
    <div class="presets" id="presets"></div>
    <div class="row gap">
      <div><label for="c-b1">Фон, верх</label><input type="color" id="c-b1"></div>
      <div><label for="c-b2">Фон, низ</label><input type="color" id="c-b2"></div>
    </div>
    <div class="row gap">
      <div><label for="c-ac">Акцент</label><input type="color" id="c-ac"></div>
      <div><label for="c-fg">Цвет кода</label><input type="color" id="c-fg"></div>
    </div>
    <div class="row gap">
      <div><label for="c-bg">Фон кода</label><input type="color" id="c-bg"></div>
    </div>
    <button class="reset" id="reset" type="button">Сбросить настройки</button>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var DEF={b1:'#ffd6c9',b2:'#c9b8ff',ac:'#6a3cff',fg:'#171321',bg:'#ffffff'};
  var PRE=[
    {n:'Закат',b1:'#ffd6c9',b2:'#c9b8ff',ac:'#6a3cff'},
    {n:'Мята',b1:'#d4f5e6',b2:'#bfe3ff',ac:'#0e8f6a'},
    {n:'Персик',b1:'#fff0c2',b2:'#ffb8c6',ac:'#d6336c'},
    {n:'Ночь',b1:'#0f1226',b2:'#2a1a4a',ac:'#8f8bff'}
  ];
  var s=Object.assign({},DEF), dataUrl=null, blob=null;
  try{var sv=JSON.parse(localStorage.getItem('qr-settings'));if(sv)s=Object.assign(s,sv);}catch(e){}
  try{ if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8']; }catch(e){}

  function lum(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce(function(a,v,i){return a+v*[.2126,.7152,.0722][i]},0)}

  function applyTheme(){
    var r=document.documentElement.style, dark=(lum(s.b1)+lum(s.b2))/2<.2;
    r.setProperty('--b1',s.b1);r.setProperty('--b2',s.b2);r.setProperty('--ac',s.ac);
    r.setProperty('--aci',lum(s.ac)>.179?'#12100a':'#ffffff');
    r.setProperty('--ink',dark?'#f4f2ff':'#171321');
    r.setProperty('--sf',dark?'rgba(255,255,255,.09)':'rgba(255,255,255,.62)');
    r.setProperty('--ln',dark?'rgba(255,255,255,.22)':'rgba(23,19,33,.15)');
    r.colorScheme=dark?'dark':'light';
    ['b1','b2','ac','fg','bg'].forEach(function(k){$('c-'+k).value=s[k]});
    document.querySelectorAll('.presets button').forEach(function(b,i){b.classList.toggle('on',PRE[i].b1===s.b1&&PRE[i].b2===s.b2&&PRE[i].ac===s.ac)});
    try{localStorage.setItem('qr-settings',JSON.stringify(s));}catch(e){}
  }

  function render(){
    var t=$('txt').value; dataUrl=null; blob=null;
    if(!t.trim()){ $('box').innerHTML='<div class="err">Введите текст или ссылку, и код появится здесь.</div>'; return; }
    try{
      var qr=qrcode(0,$('lvl').value); qr.addData(t); qr.make();
      var n=qr.getModuleCount(), m=4, cell=Math.max(4,Math.floor(1024/(n+2*m))), size=cell*(n+2*m);
      var c=document.createElement('canvas'); c.width=c.height=size;
      var x=c.getContext('2d');
      x.fillStyle=s.bg; x.fillRect(0,0,size,size); x.fillStyle=s.fg;
      for(var r=0;r<n;r++)for(var k=0;k<n;k++) if(qr.isDark(r,k)) x.fillRect((k+m)*cell,(r+m)*cell,cell,cell);
      dataUrl=c.toDataURL('image/png');
      var img=new Image(); img.alt='QR-код'; img.src=dataUrl;
      $('box').innerHTML=''; $('box').appendChild(img);
      c.toBlob(function(b){blob=b});
    }catch(e){
      $('box').innerHTML='<div class="err">Текст слишком длинный для QR-кода. Сократите его или снизьте уровень защиты.</div>';
    }
  }

  function setHint(t){$('hint').textContent=t}

  $('dl').addEventListener('click',function(){
    if(!dataUrl){return;}
    var a=document.createElement('a'); a.href=dataUrl; a.download='qr-code.png';
    document.body.appendChild(a); a.click(); a.remove();
    setHint('Файл qr-code.png сохранён в загрузки.');
  });

  $('share').addEventListener('click',function(){
    if(!dataUrl){return;}
    var txt=$('txt').value;
    function fail(){setHint('Меню «Поделиться» недоступно в этом браузере. Используйте «Скачать PNG».');}
    if(!navigator.share){fail();return;}
    function shareText(){return navigator.share({title:'QR-код',text:txt}).catch(function(e){if(!e||e.name!=='AbortError')fail();});}
    if(blob){
      try{
        var f=new File([blob],'qr-code.png',{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){
          navigator.share({files:[f],title:'QR-код'}).catch(function(e){if(e&&e.name==='AbortError')return;shareText();});
          return;
        }
      }catch(e){}
    }
    shareText();
  });

  PRE.forEach(function(p){
    var b=document.createElement('button'); b.type='button'; b.title=p.n; b.setAttribute('aria-label',p.n);
    b.style.background='linear-gradient(150deg,'+p.b1+','+p.b2+')';
    b.addEventListener('click',function(){s.b1=p.b1;s.b2=p.b2;s.ac=p.ac;applyTheme();render();});
    $('presets').appendChild(b);
  });
  ['b1','b2','ac','fg','bg'].forEach(function(k){
    $('c-'+k).addEventListener('input',function(){s[k]=this.value;applyTheme();if(k==='fg'||k==='bg')render();});
  });
  $('reset').addEventListener('click',function(){s=Object.assign({},DEF);applyTheme();render();});
  $('txt').addEventListener('input',render);
  $('lvl').addEventListener('change',render);

  applyTheme(); render();
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
</body>
</html>
